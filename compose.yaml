services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: academiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/academiq?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:5174
      JWT_SECRET: change-me
      JWT_ISSUER: academiq
      JWT_ACCESS_TTL_MINUTES: 15
      JWT_REFRESH_TTL_HOURS: 168
      LOGIN_LOCKOUT_AFTER: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
